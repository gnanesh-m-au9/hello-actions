name: Task 5 - Caching

on:
  push:

jobs:
  cache-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
    
      - name: Install
        run: npm ci
      
      - name: Test
        run: npm test
          