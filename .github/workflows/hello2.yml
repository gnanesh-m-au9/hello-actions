name : Task 2 - PR Check

on:
  pull_request:
    branches: [main]
  
jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - name: PR info
        run: |
          echo "PR Title: ${{ github.event.pull_request.title}}"
          echo "FROM: ${{ github.head_ref }}"
          echo "TO: ${{ github.base_ref }}"
