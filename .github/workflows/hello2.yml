name: Task 5 - Caching

on:
  push:

jobs:
  cache-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
    
      - name: Install
        run: npm ci
      
      - name: Test
        run: npm test
          