name : Task 6 - Artifact

on:
  push:

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Create output
        run: |
          mkdir -p out
          echo "Build output as $(date)" > out/report.txt
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: out/report.txt

  