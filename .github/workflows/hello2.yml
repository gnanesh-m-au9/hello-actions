name: Task 6 - Artifacts

on:
  push:

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Create output
        run: |
          mkdir -p out
          echo "Build output at $(date)" > out/report.txt
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: out/report.txt
          